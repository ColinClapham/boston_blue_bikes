name: Blue Bikes Monthly Data Extraction

on:
  schedule:
    - cron: "0 9 8 * *"
  workflow_dispatch:

jobs:
  run-extraction:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests loguru

      - name: Run data extraction
        run: |
          python -m biking_boston.scripts.data_extraction